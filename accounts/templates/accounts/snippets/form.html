<form method="POST" action='{% if action_url %}{{ action_url }}{% else %}{% url "account:login" %}{% endif %}'>{% csrf_token %}
    {% if next_url %}
        <input type="hidden" name="next" value="{{ next_url }}" />
    {% endif %}
    {{ form }}
    <button type="submit" class="btn bg-green-500 text-gray-100 hover:text-gray-500">Submit</button>
</form>
