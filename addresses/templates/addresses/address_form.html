{% extends "base.html" %}
{% load static %}
{% block content %}
<main class="px-16 py-6 bg-gray-100">
    <a class="p-4" href="{% url 'account:home' %}"><< Back Home</a>
    <h1 class="p-2">{{ view.object.pk|yesno:"Edit Address,Create Address" }}</h1>

    <form method="post" {% if action_url %} action="{{action_url}}"{% endif %}>
        {% csrf_token %}
        {% if address_type %}
            <input type="hidden" name="id_shipping_type" value="{{ address_type }}" />
        {% endif %}
        {{ form.as_p }}
        <button type="submit">Save</button>
    </form>
</main>
{% endblock %}
