{% extends "base.html" %}
{% block content%}
<main class="px-16 py-6 bg-gray-100">
  <a href="{% url 'account:home' %}"><< Back to Account Page</a>
  <header>
    <h1 class="text-lg font-semibold border-b border-gray-200 text-secondary-200 md:text-3xl lg:text-5xl">Product View History</h1>
  </header>

  {% if object_list %}
  <div>
    <div class="mt-8 grid lg:grid-cols-3 gap-10">
      {% for product in object_list %}
      {% include 'products/snippets/card.html' with product_obj=product.content_object counter=forloop.counter %}
      {% endfor %}
    </div>
  </div>
  {% endif %}
</main>

{% endblock %}
