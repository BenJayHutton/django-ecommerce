<nav class="flex flex-wrap items-center justify-between p-3">
    <div class="flex md:hidden">
        <button id="hamburger">
          <img class="toggle block" src="https://img.icons8.com/fluent-systems-regular/2x/menu-squared-2.png" width="48" height="48" />
          <img class="toggle hidden" src="https://img.icons8.com/fluent-systems-regular/2x/close-window.png" width="48" height="48" />
        </button>
    </div>
    <div class="toggle hidden w-full md:w-auto md:flex text-right text-bold mt-5 md:mt-0 border-t-2 border-teal-300 md:border-none">
        <a href="{% url 'home' %}" class="p-2 block md:inline-block text-teal-900 hover:text-teal-500 px-3 py-3 border-b-2 border-teal-900 md:border-none">Home
        </a>
        <a href="{% url 'products:list' %}" class="p-2 block md:inline-block text-teal-900 hover:text-teal-500 px-3 py-3 border-b-2 border-teal-900 md:border-none">Shop
        </a>
        <a href="{% url 'contact' %}" class="p-2 block md:inline-block text-teal-900 hover:text-teal-500 px-3 py-3 border-b-2 border-teal-900 md:border-none">Contact
        </a>
        <a class="p-2 block md:inline-block text-teal-900 hover:text-teal-500 px-3 py-3 border-b-2 border-teal-900 md:border-none" href="{% url 'cart:home' %}">
        <span class='navbar-cart-count m-1'>{{ request.session.cart_item_count }}</span> Cart
        </a>
        {% if user.is_authenticated %}
        <a href="{% url 'accounts:home' %}" class="p-2 block md:inline-block text-teal-900 hover:text-teal-500 px-3 py-3 border-b-2 border-teal-900 md:border-none">Account</a>
        <a href="{% url 'accounts:logout' %}" class="p-2 block md:inline-block text-teal-900 hover:text-teal-500 px-3 py-3 border-b-2 border-teal-900 md:border-none">Logout</a>
        {% else %}
        <a href="{% url 'accounts:login' %}" class="p-2 block md:inline-block text-teal-900 hover:text-teal-500 px-3 py-3 border-b-2 border-teal-900 md:border-none">Log in</a>
        <a href="{% url 'accounts:register' %}" class="p-2 block md:inline-block text-teal-900 hover:text-teal-500 px-3 py-3 border-b-2 border-teal-900 md:border-none">Register</a>
        {% endif %}
    </div>
    <div class="px-6 border-2 border-teal-900">
      {% include 'search/snippets/search-form.html' with placeholder="Search" %}
    </div>
</nav>
<script>
    document.getElementById("hamburger").onclick = function toggleMenu() {
        const navToggle = document.getElementsByClassName("toggle");
        for (let i = 0; i < navToggle.length; i++) {
          navToggle.item(i).classList.toggle("hidden");
        }
      };
</script>
